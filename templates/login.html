<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入｜照護評估系統</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body class="login-bg">
<form class="login" method="post">
  <div style="text-align:center;font-size:40px">🏡</div>
  <h1>{{ center }}<br><span style="font-size:15px;font-weight:400">照護評估系統</span></h1>
  {% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}{% endwith %}
  <label class="f">帳號</label><input type="text" name="username" autofocus autocomplete="username">
  <label class="f">密碼</label><input type="password" name="password" autocomplete="current-password">
  <button class="btn pri">登入</button>
  <p class="muted small" style="text-align:center;margin:14px 0 0">資料只存在本機，不會上傳雲端</p>
</form>
</body></html>
